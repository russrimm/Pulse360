name: Update Microsoft Lifecycle Data

on:
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  generate-lifecycle:
    runs-on: ubuntu-latest
    name: Fetch and Update Lifecycle Data
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --prod --frozen-lockfile

      - name: Fetch and parse lifecycle data
        run: node scripts/update-lifecycle-data.mjs

      - name: Upload generated lifecycle data
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-data
          path: public/data/lifecycle.json
          if-no-files-found: error

  publish-lifecycle:
    needs: generate-lifecycle
    runs-on: ubuntu-latest
    name: Publish Lifecycle Data
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download generated lifecycle data
        uses: actions/download-artifact@v4
        with:
          name: lifecycle-data
          path: public/data
      - name: Commit and push if changed
        run: |
          if git diff --exit-code public/data/lifecycle.json > /dev/null 2>&1; then
            echo "Lifecycle data is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/lifecycle.json
          git commit --no-verify -m 'chore: update Microsoft lifecycle data'
          git push
